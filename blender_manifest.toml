schema_version = "1.0.0"

id = "blender_gs_colmap_exporter"
version = "1.4.0"
name = "Gaussian Splat COLMAP Dataset Generator"
tagline = "Plan, patch and render COLMAP datasets for Gaussian Splatting"
maintainer = "Codex"
type = "add-on"

blender_version_min = "5.1.0"

license = [
  "SPDX:GPL-3.0-or-later",
]

tags = ["Render", "Import-Export", "Camera"]

permissions.files = "Export datasets and background render logs"

[build]
paths_exclude_pattern = [
  "__pycache__/",
  "/.git/",
  "/*.zip",
  "/tests/",
  "/releases/",
]
